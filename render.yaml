services:
  - type: web
    name: camila-cloud-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: ACCESS_PASSWORD
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://camila-cloud.vercel.app,https://nube-camila.vercel.app"
      - key: GOOGLE_OAUTH_TOKEN
        sync: false
      - key: COOKIE_SAMESITE
        value: "none"
      - key: MAX_UPLOAD_MB
        value: "100"
